name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  integration:
    name: Database & tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_only
          POSTGRES_DB: kantora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kantora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations up, then every migration down and up again (reversibility, ADR-0003).
      - run: pnpm db:setup
      - name: Migrations are reversible
        run: |
          set -a; . ./.env; set +a
          count=$(ls db/migrations/*.sql | wc -l)
          for i in $(seq 1 "$count"); do pnpm exec dbmate --no-dump-schema rollback; done
          pnpm db:setup
      - run: pnpm test:int
